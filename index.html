<!DOCTYPE html>
<html>
<head>
    <title>Lucky Rocket</title>

    <style>
        body {
            margin: 0;
            background: #0b0f1a;
            color: white;
            text-align: center;
            font-family: Arial;
            overflow: hidden;
        }

        #m {
            font-size: 90px;
            color: #00ffcc;
            margin-top: 120px;
            text-shadow: 0 0 20px #00ffcc;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

<h1>🚀 Lucky Rocket</h1>

<div id="m">1.00x</div>
<div id="status">Connecting...</div>

<script>
/* =========================
   🌐 自动识别本地 / 线上
========================= */

const isLocal = location.hostname === "127.0.0.1" || location.hostname === "localhost";

const wsUrl = isLocal
    ? "ws://127.0.0.1:8000/ws"
    : "wss://lucky-rocket-web.onrender.com/ws";

let ws = new WebSocket(wsUrl);

/* =========================
   📡 连接状态
========================= */

ws.onopen = () => {
    document.getElementById("status").innerText = "Connected ✅";
};

ws.onclose = () => {
    document.getElementById("status").innerText = "Disconnected ❌";
};

ws.onerror = () => {
    document.getElementById("status").innerText = "Error ⚠️";
};

/* =========================
   🚀 游戏数据
========================= */

ws.onmessage = (e) => {
    let d = JSON.parse(e.data);

    if (d.type === "tick") {
        document.getElementById("m").innerText = d.m + "x";
    }

    if (d.type === "start") {
        document.getElementById("status").innerText = "🚀 Running";
    }

    if (d.type === "crash") {
        document.getElementById("status").innerText =
            "💥 CRASH at " + d.crash;
    }
};
</script>

</body>
</html>
